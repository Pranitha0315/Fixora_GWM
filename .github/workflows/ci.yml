
name: Fixora Combined CI

on:
  push:
    branches:
      - develop
      - feature/combined-testing-ci
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Fixora.SharedBackend/tests/Fixora.tests/Fixora.tests.csproj

      - name: Run Backend Tests
        run: dotnet test Fixora.SharedBackend/tests/Fixora.tests/Fixora.tests.csproj --no-restore --logger "console;verbosity=normal"

  customer-tests:
    name: Customer Flutter Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'

      - name: Install Dependencies
        working-directory: Fixora.Customer
        run: flutter pub get

      - name: Run Customer Tests
        working-directory: Fixora.Customer
        run: flutter test

  mechanic-tests:
    name: Mechanic Flutter Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'

      - name: Install Dependencies
        working-directory: FixoraRev.Mechanic
        run: flutter pub get

      - name: Run Mechanic Tests
        working-directory: FixoraRev.Mechanic
        run: flutter test

  manager-web-tests:
    name: Manager Web Angular Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Fixora.web/package-lock.json

      - name: Install Dependencies
        working-directory: Fixora.web
        run: npm ci

      - name: Run Angular Tests
        working-directory: Fixora.web
        run: npm test -- --no-watch --no-progress
