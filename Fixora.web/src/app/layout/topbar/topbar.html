<div class="topbar">
  <div class="workspace">
    <span class="workspace-title">Workshop Management</span>
    <span class="workspace-subtitle">Manager Workspace</span>
  </div>

  <div class="topbar-actions">
    <button
      type="button"
      class="theme-toggle"
      (click)="toggleTheme()"
      [attr.aria-label]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
      [attr.title]="isDarkMode() ? 'Light mode' : 'Dark mode'"
      [attr.aria-pressed]="isDarkMode()"
    >
      @if (isDarkMode()) {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="21"
          height="21"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>
        </svg>
      } @else {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="21"
          height="21"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M20.9 13.1A9 9 0 0 1 10.9 3.1 9 9 0 1 0 20.9 13.1Z"/>
        </svg>
      }
    </button>
    <a
      class="notification-link"
      routerLink="/notifications"
      aria-label="Open notifications"
      title="Notifications"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="21"
        height="21"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
        <path d="M10 21h4"/>
      </svg>
    </a>

          <button
        type="button"
        class="logout-button"
        aria-label="Sign out"
        title="Sign out"
        [disabled]="isLoggingOut()"
        (click)="logout()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M10 17l5-5-5-5"/>
          <path d="M15 12H3"/>
          <path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/>
        </svg>
      </button>
    <div class="account-divider" aria-hidden="true"></div>

    <div class="account">
      <span class="account-avatar" aria-hidden="true">{{ accountInitial }}</span>

      <div class="account-details">
        <span class="account-name">{{ accountName }}</span>
        <span class="account-role">{{ accountRole }}</span>
      </div>
    </div>
  </div>
</div>

@if (logoutError()) {
  <p class="logout-feedback" role="alert">
    {{ logoutError() }}
    <a routerLink="/login">Open login</a>
  </p>
}
