<div class="topbar">
  <div class="workspace">
    <span class="workspace-title">Workshop Management</span>
    <span class="workspace-subtitle">Manager Workspace</span>
  </div>

  <div class="topbar-actions">
    <a
      class="notification-link"
      routerLink="/notifications"
      aria-label="Open notifications"
      title="Notifications"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="21"
        height="21"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
        <path d="M10 21h4"/>
      </svg>
    </a>

    <div class="account-divider" aria-hidden="true"></div>

    <div class="account">
      <span class="account-avatar" aria-hidden="true">M</span>

      <div class="account-details">
        <span class="account-name">Manager</span>
        <span class="account-role">Workspace account</span>
      </div>
    </div>
  </div>
</div>
