<div class="sidebar">
  <div class="brand">
    <span class="brand-name">FIXORA</span>
    <span class="brand-subtitle">MANAGER PORTAL</span>
  </div>

  <nav class="navigation" aria-label="Manager navigation">
    <span class="navigation-heading">WORKSPACE</span>

    @for (item of navigationItems; track item.route) {
      <a
        class="navigation-link"
        [routerLink]="item.route"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <span class="navigation-icon" aria-hidden="true">
          {{ item.icon }}
        </span>

        <span class="navigation-label">
          {{ item.label }}
        </span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <span class="footer-title">FIXORA Manager</span>
    <span class="footer-subtitle">Workshop Management</span>
  </div>
</div>
