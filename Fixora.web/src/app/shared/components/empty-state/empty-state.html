<div
  class="fx-empty-state"
  [class.fx-empty-state--compact]="compact()"
>
  @if (showIcon()) {
    <div class="fx-empty-icon" aria-hidden="true">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        @switch (icon()) {
          @case ('search') {
            <circle cx="10.5" cy="10.5" r="6.5" />
            <path d="m16 16 5 5" />
          }

          @case ('calendar') {
            <rect x="3" y="5" width="18" height="16" rx="2" />
            <path d="M7 3v4M17 3v4M3 10h18" />
          }

          @case ('file') {
            <path d="M6 3h8l4 4v14H6zM14 3v5h4" />
            <path d="M9 13h6M9 17h6" />
          }

          @default {
            <path d="M5 4h14l3 9v7H2v-7L5 4Z" />
            <path d="M2 13h6l2 3h4l2-3h6" />
          }
        }
      </svg>
    </div>
  }

  <div class="fx-empty-copy" role="status">
    <h2 class="fx-empty-title">
      {{ title() }}
    </h2>

    @if (description()) {
      <p class="fx-empty-description">
        {{ description() }}
      </p>
    }
  </div>

  @if (actionLabel().trim()) {
    <fx-button
      [variant]="actionVariant()"
      [disabled]="actionDisabled()"
      (pressed)="handleAction()"
    >
      {{ actionLabel() }}
    </fx-button>
  }
</div>
