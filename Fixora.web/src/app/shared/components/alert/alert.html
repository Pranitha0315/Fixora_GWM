<div [class]="alertClasses()">
  @if (showIcon()) {
    <span class="fx-alert-icon" aria-hidden="true">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        @switch (tone()) {
          @case ('success') {
            <circle cx="12" cy="12" r="9" />
            <path d="m8 12 3 3 5-6" />
          }
          @case ('error') {
            <circle cx="12" cy="12" r="9" />
            <path d="m9 9 6 6m0-6-6 6" />
          }
          @case ('warning') {
            <path d="M12 3 2 21h20L12 3Z" />
            <path d="M12 9v5m0 3h.01" />
          }
          @default {
            <circle cx="12" cy="12" r="9" />
            <path d="M12 11v6m0-10h.01" />
          }
        }
      </svg>
    </span>
  }

  <div
    class="fx-alert-copy"
    [attr.role]="announcementRole()"
    aria-atomic="true"
  >
    <p class="fx-alert-title">{{ title() }}</p>

    @if (message()) {
      <p class="fx-alert-message">{{ message() }}</p>
    }
  </div>

  @if (dismissible()) {
    <button
      type="button"
      class="fx-alert-dismiss"
      [attr.aria-label]="dismissLabel()"
      (click)="dismiss()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="m6 6 12 12M18 6 6 18" />
      </svg>
    </button>
  }
</div>
