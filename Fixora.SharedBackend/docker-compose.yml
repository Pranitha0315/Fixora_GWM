services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${FIXORA_SQL_PASSWORD:?Set FIXORA_SQL_PASSWORD}"
    ports: ["1433:1433"]
    volumes: ["fixora-sql:/var/opt/mssql"]
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q 'SELECT 1' || exit 1
      interval: 10s
      retries: 10

  api:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Fixora: "Server=sqlserver,1433;Database=FixoraDb;User Id=sa;Password=${FIXORA_SQL_PASSWORD:?Set FIXORA_SQL_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
      Jwt__SigningKey: "${FIXORA_JWT_KEY:?Set FIXORA_JWT_KEY}"
    ports: ["5080:8080"]

volumes:
  fixora-sql: