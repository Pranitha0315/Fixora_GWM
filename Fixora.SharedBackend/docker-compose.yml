# docker compose up --build  →  SQL Server + Fixora API on http://localhost:5080
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Fixora#2026"
    ports: ["1433:1433"]
    volumes: ["fixora-sql:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Fixora#2026' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10

  api:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Fixora: "Server=sqlserver,1433;Database=FixoraDb;User Id=sa;Password=Fixora#2026;TrustServerCertificate=True;MultipleActiveResultSets=True"
      Jwt__SigningKey: "change-this-to-a-long-random-secret-for-your-env-123"
    ports: ["5080:8080"]

volumes:
  fixora-sql:
