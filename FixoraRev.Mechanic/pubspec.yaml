name: fixora_rev
description: Fixora Rev - the mechanic app of the Fixora Garage & Workshop Management System.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

# Demo runs on local mock data. Swap the mock repositories in
# lib/core/di/app_services.dart (and the Riverpod providers) for API ones later.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.2.4
  record: ^5.1.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.6
  # Legacy http kept for any remaining callers; ApiClient uses Dio.
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  # Inter, SIL Open Font License: assets/fonts/OFL-Inter.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 900
